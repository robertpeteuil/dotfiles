# Dotbot Config File for dotbot versions > 1.24.0

- defaults:
    link:
      create: true
      relink: true
      force: false

- clean:
    ~/:
    ~/.config:
      recursive: true

# Settings - Zsh
- link:
    ~/.zshenv:
      path: zsh/.zshenv
      force: true

# Settings - Bash
- link:
    ~/.bash-git-prompt:
      path: shell/bash-git-prompt
      force: true
    ~/.grc:
      path: shell/grc
      force: true
    ~/.bash_profile:
      path: shell/bash_profile
      force: true
    ~/.bashrc:
      path: shell/bashrc
      force: true

# Config - Git
- link:
    ~/.gitconfig:
      path: shell/gitconfig
      force: true
    ~/.gitconfig_ssh:
      path: shell/gitconfig_ssh
      force: true
    ~/.gitignore_global:
      path: shell/gitignore_global
      force: true
- shell:
    - command: 'if test ! -s "$HOME/.gitconfig_custom" || test ./shell/setup-gitconfig-custom -nt "$HOME/.gitconfig_custom"; then ./shell/setup-gitconfig-custom; fi'
      quiet: true
      stdout: true

# Config - Dotfiles Core
- link:
    ~/.tmux.conf:
      if: "test -e ./config/tmux/tmux.conf"
      path: config/tmux/tmux.conf
      force: true
    ~/.config/eza/theme.yml:
      path: config/eza/tokyonight.yml
      force: false
    ~/.config/lazygit/config.yml:
      path: config/lazygit/config.yml
      force: false
    ~/.config/atuin/config.toml:
      path: config/atuin/config.toml
      force: true
    ~/.config/atuin/themes:
      path: config/atuin/themes
      force: true
    ~/.config/television:
      path: config/television
      force: false
    ~/.config/tombi/config.toml:
      path: config/tombi/config.toml
      force: true

# Config - macOS Specific
- link:
    ~/.config/ghostty/config:
      if: "[ `uname` = Darwin ]"
      path: config/ghostty/config-macos
      force: false
    ~/.config/ghostty/shaders:
      if: "[ `uname` = Darwin ]"
      path: config/ghostty/shaders
      force: false
    ~/.config/ghostty/themes/tokyonight_night:
      if: "[ `uname` = Darwin ]"
      path: config/ghostty/tokyonight_night
      force: false
    ~/.jqp.yaml:
      if: "[ `uname` = Darwin ]"
      path: config/jqp/jqp.yaml
      force: false
